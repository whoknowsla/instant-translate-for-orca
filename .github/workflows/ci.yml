name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container: fedora:rawhide
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: >-
          dnf install -y
          gcc
          gtk3
          libsecret
          orca
          python3-devel
          python3-gobject
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Sync project and development tools
        run: uv sync --locked
      - name: Compile
        run: uv run --locked python -m compileall -q instant_translate tests
      - name: Test
        run: uv run --locked pytest -q
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked mypy instant_translate
      - name: Security scan
        run: uv run --locked bandit -c pyproject.toml -r instant_translate
